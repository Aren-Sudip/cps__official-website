<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="stylesecond.css" class="css">
    


</head>
<body>


        <div class="devices__flex">
    
    <div class="devices__flex-title">
      Repair of various types of equipment
    </div>
    
    <div class="devices__flex--container repair__carousel" >
<div class="swiper-wrapper">
    
    <div class="swiper-slide devices__flex-items devices__flex--laptop">
      <span class="devices__flex--items-text devices__flex--laptop-text">Laptop repair</span>
      <div class="devices__flex--laptop-icon">
        <img class="devices__flex--items__repair-icon" src="images/Laptop Repair Icon.svg" alt="repair" width="40px" height="40px">
      </div>

    </div>
   

 <div class="swiper-slide devices__flex-items devices__flex--laptop">
      <span class="devices__flex--items-textdevices__flex--laptop-text">Tablet repair</span>
      <div class="devices__flex--laptop-icon">
        <img class="devices__flex--items__repair-icon" src="images/Laptop Repair Icon.svg"  alt="repair" width="40px" height="40px">
      </div>

    </div>

     <div class="swiper-slide devices__flex-items devices__flex--laptop">
      <span class="devices__flex--items-textdevices__flex--laptop-text">PC repair</span>
      <div class="devices__flex--laptop-icon">
        <img class="devices__flex--items__repair-icon" src="images/Laptop Repair Icon.svg" alt="repair" width="40px" height="40px">
      </div>

    </div>

     <div class="swiper-slide devices__flex-items devices__flex--laptop">
      <span class="devices__flex--items-textdevices__flex--laptop-text">Monitor repair</span>
      <div class="devices__flex--laptop-icon">
        <img class="devices__flex--items__repair-icon" src="images/Laptop Repair Icon.svg" alt="repair" width="40px" height="40px">
      </div>

    </div>
  </div>
  <div class="repair__pagination swiper-pagination"></div>
</div>

  <div class="devices__flex--items-show">
    <img class="devices__flex--items__show-icon" src="images/Icon (3) copy.svg" alt="show-all">
    <span class="devices__flex--items__show-text">Show all</span>
  </div>
</div>


    

  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script>
    const brandsSwiper = new Swiper('.brands__carousel', {
      loop: true,
  slidesPerView: 1.15,
  spaceBetween:16,
  centeredSlides: false,
  pagination: {
    el: '.brands__pagination',
    clickable: true,
  },
});
    const repairSwiper = new Swiper('.repair__carousel', {
      loop: true,
  slidesPerView: 1.15,
  spaceBetween:16,
  centeredSlides: false,
  pagination: {
    el: '.repair__pagination',
    clickable: true,
  },
});
        </script>
      
</body>
</html>
